name: Create Pull Request

on:
  push:
    branches:
      - 'feature-**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            // Check if a PR already exists for this branch
            const { data: existingPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'develop',
              state: 'open'
            });

            if (existingPrs.length > 0) {
              const pr = existingPrs[0];
              core.setOutput('pr_number', pr.number);
              console.log(`PR #${pr.number} already exists for ${branch} → develop. Skipping creation.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge ${branch} into develop`,
              head: branch,
              base: 'develop',
              body: `Automated PR created by GitHub Actions to merge \`${branch}\` into \`develop\`.`
            });
            core.setOutput('pr_number', pr.number);
            console.log(`Pull request #${pr.number} created successfully.`);

      - name: Request Copilot Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = '${{ steps.create-pr.outputs.pr_number }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: '@copilot please review this pull request.'
            });
            console.log(`Copilot review requested on PR #${prNumber}`);

    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
